<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Window Frame -->
  <rect width="960" height="540" fill="#0f172a" rx="12"/>
  <rect width="960" height="36" fill="#0b1120" rx="12"/>
  <rect y="26" width="960" height="10" fill="#0b1120"/>
  <circle cx="20" cy="18" r="5" fill="#ef4444"/>
  <circle cx="36" cy="18" r="5" fill="#f59e0b"/>
  <circle cx="52" cy="18" r="5" fill="#10b981"/>
  <text x="480" y="22" text-anchor="middle" fill="#64748b" font-size="10.5">T-CLIP — Tamper-Evident Cryptographic Attestation Modal</text>

  <!-- Dimmed Background Overlay -->
  <rect y="36" width="960" height="504" fill="#000000" fill-opacity="0.45"/>

  <!-- Centered Attestation Card Modal -->
  <g transform="translate(180, 70)" filter="url(#shadow)">
    <rect width="600" height="430" rx="16" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>

    <!-- Modal Header -->
    <rect width="600" height="75" rx="16" fill="#064e3b" fill-opacity="0.3"/>
    <rect y="60" width="600" height="15" fill="#064e3b" fill-opacity="0.3"/>

    <!-- Shield Icon -->
    <rect x="25" y="18" width="40" height="40" rx="10" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.4"/>
    <text x="45" y="44" text-anchor="middle" fill="#34d399" font-size="20">🔏</text>

    <text x="80" y="38" fill="#ffffff" font-size="16" font-weight="700">Tamper-Evident Attestation Seal</text>
    <text x="80" y="56" fill="#a7f3d0" font-size="11.5">All mandatory compliance controls completed and cryptographically attested</text>

    <!-- Body Content -->
    <g transform="translate(25, 90)">
      <!-- Cryptographic Hash Box -->
      <rect width="550" height="50" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="16" y="20" fill="#94a3b8" font-size="10" font-weight="700">SOURCE FILE SHA-256 DIGEST (WEB CRYPTO API):</text>
      <text x="16" y="38" fill="#38bdf8" font-size="11" font-family="monospace">e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855</text>

      <!-- Review Summary Row -->
      <g transform="translate(0, 65)">
        <rect width="175" height="55" rx="8" fill="#1e293b"/>
        <text x="14" y="22" fill="#94a3b8" font-size="10">TOTAL CONTROLS</text>
        <text x="14" y="44" fill="#f8fafc" font-size="18" font-weight="700">48 / 48 (100%)</text>

        <g transform="translate(188, 0)">
          <rect width="175" height="55" rx="8" fill="#1e293b"/>
          <text x="14" y="22" fill="#94a3b8" font-size="10">PASSED ITEMS</text>
          <text x="14" y="44" fill="#34d399" font-size="18" font-weight="700">46 Passed</text>
        </g>

        <g transform="translate(375, 0)">
          <rect width="175" height="55" rx="8" fill="#1e293b"/>
          <text x="14" y="22" fill="#94a3b8" font-size="10">EXCEPTIONS / NA</text>
          <text x="14" y="44" fill="#94a3b8" font-size="18" font-weight="700">2 Justified</text>
        </g>
      </g>

      <!-- Signatures Box -->
      <g transform="translate(0, 135)">
        <rect width="550" height="95" rx="8" fill="#131d31" stroke="#1e293b"/>
        <text x="16" y="22" fill="#cbd5e1" font-size="11" font-weight="600">Dual Sign-Off Audit Trail:</text>

        <!-- Signature 1 -->
        <circle cx="28" cy="45" r="10" fill="#8b5cf6" fill-opacity="0.3"/>
        <text x="28" y="49" text-anchor="middle" fill="#c4b5fd" font-size="10" font-weight="700">S</text>
        <text x="46" y="44" fill="#f1f5f9" font-size="11" font-weight="600">Sarah Chen (Security Lead)</text>
        <text x="46" y="57" fill="#64748b" font-size="9.5">Evaluated 48 items  •  2026-10-02T19:30:14Z</text>
        <rect x="475" y="36" width="60" height="18" rx="4" fill="#4c1d95" fill-opacity="0.3"/>
        <text x="505" y="49" text-anchor="middle" fill="#c4b5fd" font-size="9.5">reviewer</text>

        <!-- Signature 2 -->
        <circle cx="28" cy="75" r="10" fill="#10b981" fill-opacity="0.3"/>
        <text x="28" y="79" text-anchor="middle" fill="#6ee7b7" font-size="10" font-weight="700">M</text>
        <text x="46" y="74" fill="#f1f5f9" font-size="11" font-weight="600">Marcus Vance (VP Engineering / Release Authority)</text>
        <text x="46" y="87" fill="#64748b" font-size="9.5">Confirmed &amp; Authorized Release  •  2026-10-02T21:15:00Z</text>
        <rect x="475" y="66" width="60" height="18" rx="4" fill="#064e3b" fill-opacity="0.4"/>
        <text x="505" y="79" text-anchor="middle" fill="#6ee7b7" font-size="9.5">approver</text>
      </g>

      <!-- Action Buttons -->
      <g transform="translate(0, 250)">
        <rect x="330" y="0" width="220" height="38" rx="8" fill="#059669"/>
        <text x="440" y="24" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Download Attestation JSON</text>

        <rect x="190" y="0" width="130" height="38" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="255" y="24" text-anchor="middle" fill="#cbd5e1" font-size="12">Copy Audit Hash</text>
      </g>

      <text x="275" y="315" text-anchor="middle" fill="#64748b" font-size="10">
        Ready for CI/CD gating: Commit <tspan fill="#34d399" font-family="monospace">checklist-attestation.json</tspan> into release tags
      </text>
    </g>
  </g>
</svg>
