<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Window Frame -->
  <rect width="960" height="560" fill="#0f172a" rx="12"/>
  <rect width="960" height="36" fill="#0b1120" rx="12"/>
  <rect y="26" width="960" height="10" fill="#0b1120"/>
  <circle cx="20" cy="18" r="5" fill="#ef4444"/>
  <circle cx="36" cy="18" r="5" fill="#f59e0b"/>
  <circle cx="52" cy="18" r="5" fill="#10b981"/>
  <text x="480" y="22" text-anchor="middle" fill="#64748b" font-size="10.5">T-CLIP — Compliance Analytics Dashboard</text>

  <!-- Header & Tabs -->
  <rect y="36" width="960" height="46" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <rect x="20" y="46" width="24" height="24" rx="5" fill="#2563eb"/>
  <text x="32" y="62" text-anchor="middle" fill="#fff" font-size="13" font-weight="800">✓</text>
  <text x="50" y="62" fill="#fff" font-size="13" font-weight="700">T-CLIP</text>

  <rect y="82" width="960" height="38" fill="#131d31" stroke="#1e293b" stroke-width="1"/>
  <text x="70" y="105" text-anchor="middle" fill="#94a3b8" font-size="12">📋 Checklist</text>
  <rect x="125" y="87" width="110" height="28" rx="6" fill="#1e293b"/>
  <text x="180" y="105" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="600">📊 Dashboard</text>

  <!-- 4 Summary Stat Cards -->
  <g transform="translate(20, 130)">
    <!-- Card 1: Completion -->
    <rect width="215" height="85" rx="8" fill="#1e293b" stroke="#334155" filter="url(#shadow)"/>
    <text x="16" y="26" fill="#94a3b8" font-size="11" font-weight="600">OVERALL COMPLETION</text>
    <text x="16" y="60" fill="#38bdf8" font-size="28" font-weight="800">87.5%</text>
    <text x="16" y="76" fill="#64748b" font-size="10.5">42 of 48 items resolved</text>

    <!-- Card 2: Pass Rate -->
    <g transform="translate(235, 0)">
      <rect width="215" height="85" rx="8" fill="#1e293b" stroke="#334155" filter="url(#shadow)"/>
      <text x="16" y="26" fill="#94a3b8" font-size="11" font-weight="600">PASSED CONTROLS</text>
      <text x="16" y="60" fill="#34d399" font-size="28" font-weight="800">38</text>
      <text x="16" y="76" fill="#6ee7b7" font-size="10.5">90.4% verification rate</text>
    </g>

    <!-- Card 3: Failed Controls -->
    <g transform="translate(470, 0)">
      <rect width="215" height="85" rx="8" fill="#1e293b" stroke="#334155" filter="url(#shadow)"/>
      <text x="16" y="26" fill="#94a3b8" font-size="11" font-weight="600">FAILED CONTROLS</text>
      <text x="16" y="60" fill="#f87171" font-size="28" font-weight="800">2</text>
      <text x="16" y="76" fill="#fca5a5" font-size="10.5">Requires remediation</text>
    </g>

    <!-- Card 4: Action Items Pending -->
    <g transform="translate(705, 0)">
      <rect width="215" height="85" rx="8" fill="#1e293b" stroke="#334155" filter="url(#shadow)"/>
      <text x="16" y="26" fill="#94a3b8" font-size="11" font-weight="600">AWAITING APPROVAL</text>
      <text x="16" y="60" fill="#c084fc" font-size="28" font-weight="800">4</text>
      <text x="16" y="76" fill="#d8b4fe" font-size="10.5">Dual sign-off pending</text>
    </g>
  </g>

  <!-- Middle Row: Donut Chart & Category Compliance -->
  <g transform="translate(20, 230)">
    <!-- Left: Status Breakdown Donut -->
    <rect width="330" height="305" rx="8" fill="#1e293b" stroke="#334155" filter="url(#shadow)"/>
    <text x="16" y="28" fill="#f1f5f9" font-size="13" font-weight="700">Status Distribution</text>

    <!-- Simulated Donut Chart -->
    <g transform="translate(165, 140)">
      <!-- Circle segments -->
      <circle cx="0" cy="0" r="75" fill="none" stroke="#059669" stroke-width="26" stroke-dasharray="350 471"/>
      <circle cx="0" cy="0" r="75" fill="none" stroke="#dc2626" stroke-width="26" stroke-dasharray="30 471" stroke-dashoffset="-350"/>
      <circle cx="0" cy="0" r="75" fill="none" stroke="#d97706" stroke-width="26" stroke-dasharray="45 471" stroke-dashoffset="-380"/>
      <circle cx="0" cy="0" r="75" fill="none" stroke="#475569" stroke-width="26" stroke-dasharray="46 471" stroke-dashoffset="-425"/>
      <text x="0" y="4" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="800">48</text>
      <text x="0" y="20" text-anchor="middle" fill="#94a3b8" font-size="10">TOTAL ITEMS</text>
    </g>

    <!-- Legend -->
    <g transform="translate(25, 250)">
      <circle cx="10" cy="10" r="5" fill="#059669"/>
      <text x="22" y="14" fill="#cbd5e1" font-size="11">Pass (38)</text>

      <circle cx="95" cy="10" r="5" fill="#dc2626"/>
      <text x="107" y="14" fill="#cbd5e1" font-size="11">Fail (2)</text>

      <circle cx="170" cy="10" r="5" fill="#d97706"/>
      <text x="182" y="14" fill="#cbd5e1" font-size="11">Pending (6)</text>

      <circle cx="260" cy="10" r="5" fill="#475569"/>
      <text x="272" y="14" fill="#cbd5e1" font-size="11">N/A (2)</text>
    </g>

    <!-- Right: Category Compliance Bars & Action Queue -->
    <g transform="translate(345, 0)">
      <rect width="575" height="305" rx="8" fill="#1e293b" stroke="#334155" filter="url(#shadow)"/>
      <text x="16" y="28" fill="#f1f5f9" font-size="13" font-weight="700">Category Compliance &amp; Verification Progress</text>

      <!-- Category 1 -->
      <g transform="translate(16, 50)">
        <text x="0" y="12" fill="#cbd5e1" font-size="11.5" font-weight="600">V1: Architecture, Design &amp; Threat Modeling</text>
        <text x="540" y="12" text-anchor="end" fill="#34d399" font-size="11" font-weight="700">100%</text>
        <rect y="20" width="540" height="8" rx="4" fill="#0f172a"/>
        <rect y="20" width="540" height="8" rx="4" fill="#10b981"/>
      </g>

      <!-- Category 2 -->
      <g transform="translate(16, 95)">
        <text x="0" y="12" fill="#cbd5e1" font-size="11.5" font-weight="600">V2: Authentication &amp; Credential Storage</text>
        <text x="540" y="12" text-anchor="end" fill="#38bdf8" font-size="11" font-weight="700">90%</text>
        <rect y="20" width="540" height="8" rx="4" fill="#0f172a"/>
        <rect y="20" width="486" height="8" rx="4" fill="#3b82f6"/>
      </g>

      <!-- Category 3 -->
      <g transform="translate(16, 140)">
        <text x="0" y="12" fill="#cbd5e1" font-size="11.5" font-weight="600">V3: Session Management &amp; Tokens</text>
        <text x="540" y="12" text-anchor="end" fill="#f87171" font-size="11" font-weight="700">75% (1 Fail)</text>
        <rect y="20" width="540" height="8" rx="4" fill="#0f172a"/>
        <rect y="20" width="405" height="8" rx="4" fill="#f59e0b"/>
      </g>

      <!-- Category 4 -->
      <g transform="translate(16, 185)">
        <text x="0" y="12" fill="#cbd5e1" font-size="11.5" font-weight="600">V4: Access Control &amp; Authorization</text>
        <text x="540" y="12" text-anchor="end" fill="#34d399" font-size="11" font-weight="700">100%</text>
        <rect y="20" width="540" height="8" rx="4" fill="#0f172a"/>
        <rect y="20" width="540" height="8" rx="4" fill="#10b981"/>
      </g>

      <!-- Category 5 -->
      <g transform="translate(16, 230)">
        <text x="0" y="12" fill="#cbd5e1" font-size="11.5" font-weight="600">V5: Cryptography &amp; Secret Management</text>
        <text x="540" y="12" text-anchor="end" fill="#fcd34d" font-size="11" font-weight="700">60% (Pending)</text>
        <rect y="20" width="540" height="8" rx="4" fill="#0f172a"/>
        <rect y="20" width="324" height="8" rx="4" fill="#6366f1"/>
      </g>
    </g>
  </g>
</svg>
