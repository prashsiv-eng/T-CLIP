<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background:#0b1120; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif;">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#0b1120" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" fill="url(#bgGlow)" rx="16"/>
  <rect width="960" height="480" fill="none" stroke="#1e293b" stroke-width="1.5" rx="16"/>

  <!-- Title -->
  <text x="480" y="44" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700" letter-spacing="0.5">T-CLIP GitOps Compliance &amp; Major PR Workflow</text>
  <text x="480" y="68" text-anchor="middle" fill="#94a3b8" font-size="12">Continuous compliance: Check in checklist.json alongside code at every milestone</text>

  <!-- Step 1: Feature PR -->
  <g transform="translate(40, 100)" filter="url(#shadow)">
    <rect width="250" height="310" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="250" height="46" rx="12" fill="#1e293b"/>
    <rect y="36" width="250" height="10" fill="#1e293b"/>
    <circle cx="28" cy="23" r="12" fill="#3b82f6" fill-opacity="0.2"/>
    <text x="28" y="27" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="700">1</text>
    <text x="50" y="27" fill="#f1f5f9" font-size="13" font-weight="600">Major Feature PR</text>

    <!-- Contributor Role Badge -->
    <rect x="18" y="58" width="90" height="20" rx="4" fill="#1e3a8a" fill-opacity="0.4" stroke="#3b82f6" stroke-opacity="0.3"/>
    <text x="63" y="72" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">contributor</text>

    <text x="18" y="102" fill="#cbd5e1" font-size="12" font-weight="600">Developer Actions:</text>
    <circle cx="26" cy="122" r="3" fill="#38bdf8"/>
    <text x="36" y="126" fill="#94a3b8" font-size="11">Implement feature code</text>

    <circle cx="26" cy="148" r="3" fill="#38bdf8"/>
    <text x="36" y="152" fill="#94a3b8" font-size="11">Open T-CLIP with checklist.json</text>

    <circle cx="26" cy="174" r="3" fill="#38bdf8"/>
    <text x="36" y="178" fill="#94a3b8" font-size="11">Fill custom evidence fields:</text>
    <rect x="36" y="188" width="194" height="22" rx="4" fill="#1e293b"/>
    <text x="44" y="203" fill="#60a5fa" font-size="10" font-family="monospace">evidence_url: github.com/pull/42</text>

    <circle cx="26" cy="230" r="3" fill="#38bdf8"/>
    <text x="36" y="234" fill="#94a3b8" font-size="11">Add implementation notes</text>

    <!-- Checkin Banner -->
    <rect x="18" y="254" width="214" height="42" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="28" y="272" fill="#f8fafc" font-size="11" font-weight="600">Git Commit</text>
    <text x="28" y="287" fill="#38bdf8" font-size="10" font-family="monospace">git add checklist.json</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(300, 240)">
    <line x1="0" y1="0" x2="45" y2="0" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 4"/>
    <polygon points="45,-5 55,0 45,5" fill="#3b82f6"/>
    <text x="25" y="-12" text-anchor="middle" fill="#60a5fa" font-size="10">PR Review</text>
  </g>

  <!-- Step 2: Peer Review & Verification -->
  <g transform="translate(355, 100)" filter="url(#shadow)">
    <rect width="250" height="310" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="250" height="46" rx="12" fill="#1e293b"/>
    <rect y="36" width="250" height="10" fill="#1e293b"/>
    <circle cx="28" cy="23" r="12" fill="#8b5cf6" fill-opacity="0.2"/>
    <text x="28" y="27" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="700">2</text>
    <text x="50" y="27" fill="#f1f5f9" font-size="13" font-weight="600">Review &amp; Verification</text>

    <!-- Reviewer Role Badge -->
    <rect x="18" y="58" width="75" height="20" rx="4" fill="#4c1d95" fill-opacity="0.4" stroke="#8b5cf6" stroke-opacity="0.3"/>
    <text x="55" y="72" text-anchor="middle" fill="#c4b5fd" font-size="10" font-weight="600">reviewer</text>

    <text x="18" y="102" fill="#cbd5e1" font-size="12" font-weight="600">Security Lead / Peer:</text>
    <circle cx="26" cy="122" r="3" fill="#a78bfa"/>
    <text x="36" y="126" fill="#94a3b8" font-size="11">Inspect code changes &amp; tests</text>

    <circle cx="26" cy="148" r="3" fill="#a78bfa"/>
    <text x="36" y="152" fill="#94a3b8" font-size="11">Audit developer evidence</text>

    <circle cx="26" cy="174" r="3" fill="#a78bfa"/>
    <text x="36" y="178" fill="#94a3b8" font-size="11">Set item compliance status:</text>

    <rect x="36" y="188" width="58" height="22" rx="4" fill="#065f46" stroke="#10b981" stroke-width="0.5"/>
    <text x="65" y="203" text-anchor="middle" fill="#6ee7b7" font-size="10" font-weight="700">✓ Pass</text>

    <rect x="100" y="188" width="58" height="22" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="0.5"/>
    <text x="129" y="203" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="700">✕ Fail</text>

    <rect x="164" y="188" width="58" height="22" rx="4" fill="#334155"/>
    <text x="193" y="203" text-anchor="middle" fill="#cbd5e1" font-size="10" font-weight="700">N/A</text>

    <circle cx="26" cy="230" r="3" fill="#a78bfa"/>
    <text x="36" y="234" fill="#94a3b8" font-size="11">Record rationale in history log</text>

    <!-- Sign-off Banner -->
    <rect x="18" y="254" width="214" height="42" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="28" y="272" fill="#f8fafc" font-size="11" font-weight="600">Merge PR to Main</text>
    <text x="28" y="287" fill="#a78bfa" font-size="10">Checklist updated in branch</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(615, 240)">
    <line x1="0" y1="0" x2="45" y2="0" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4"/>
    <polygon points="45,-5 55,0 45,5" fill="#10b981"/>
    <text x="25" y="-12" text-anchor="middle" fill="#6ee7b7" font-size="10">Release Tag</text>
  </g>

  <!-- Step 3: Release Gate & Attestation -->
  <g transform="translate(670, 100)" filter="url(#shadow)">
    <rect width="250" height="310" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="250" height="46" rx="12" fill="#1e293b"/>
    <rect y="36" width="250" height="10" fill="#1e293b"/>
    <circle cx="28" cy="23" r="12" fill="#10b981" fill-opacity="0.2"/>
    <text x="28" y="27" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700">3</text>
    <text x="50" y="27" fill="#f1f5f9" font-size="13" font-weight="600">Release Gate &amp; Seal</text>

    <!-- Approver Role Badge -->
    <rect x="18" y="58" width="75" height="20" rx="4" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-opacity="0.3"/>
    <text x="55" y="72" text-anchor="middle" fill="#6ee7b7" font-size="10" font-weight="600">approver</text>

    <text x="18" y="102" fill="#cbd5e1" font-size="12" font-weight="600">Release Authority:</text>
    <circle cx="26" cy="122" r="3" fill="#34d399"/>
    <text x="36" y="126" fill="#94a3b8" font-size="11">Dual Sign-Off: Confirm items</text>

    <circle cx="26" cy="148" r="3" fill="#34d399"/>
    <text x="36" y="152" fill="#94a3b8" font-size="11">Verify 100% mandatory pass</text>

    <circle cx="26" cy="174" r="3" fill="#34d399"/>
    <text x="36" y="178" fill="#94a3b8" font-size="11">Export Cryptographic Seal:</text>
    <rect x="36" y="188" width="194" height="22" rx="4" fill="#1e293b"/>
    <text x="44" y="203" fill="#34d399" font-size="9" font-family="monospace">checklist-attestation.json (SHA-256)</text>

    <circle cx="26" cy="230" r="3" fill="#34d399"/>
    <text x="36" y="234" fill="#94a3b8" font-size="11">CI/CD Gate verifies signature</text>

    <!-- Attestation Badge -->
    <rect x="18" y="254" width="214" height="42" rx="6" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-opacity="0.4"/>
    <text x="28" y="272" fill="#6ee7b7" font-size="11" font-weight="700">✓ Production Approved</text>
    <text x="28" y="287" fill="#a7f3d0" font-size="10">Immutable tamper-evident audit</text>
  </g>

  <!-- Bottom Tip -->
  <rect x="40" y="425" width="880" height="35" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#334155"/>
  <text x="55" y="447" fill="#93c5fd" font-size="11" font-weight="700">💡 Pro Tip:</text>
  <text x="110" y="447" fill="#cbd5e1" font-size="11">Never merge a release candidate branch without verifying that <tspan fill="#38bdf8" font-family="monospace">checklist-attestation.json</tspan> passes the automated GitHub Actions compliance check.</text>
</svg>
