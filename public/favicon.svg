<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="tclip-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="tclip-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0.3" />
    </linearGradient>
    <filter id="check-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.75" flood-color="#0f172a" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer rounded squircle background -->
  <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#tclip-bg)" stroke="url(#tclip-border)" stroke-width="1.2" />

  <!-- Inner subtle ambient glow -->
  <rect x="2" y="2" width="28" height="14" rx="7" fill="#ffffff" fill-opacity="0.08" />

  <!-- Iconic sharp white checkmark -->
  <path
    d="M8.5 16.5 L13.5 21.5 L23.5 10.5"
    fill="none"
    stroke="#ffffff"
    stroke-width="3.2"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#check-shadow)"
  />
</svg>